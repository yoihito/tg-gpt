max_concurrent_requests: 1
default_model:
  model_id: gpt-6.1-sol
models:
  - name: GPT-6.1 Sol
    model_id: gpt-6.1-sol
    provider: openai
  - name: GLM-5.3 (DeepInfra)
    model_id: zai-org/GLM-5.3
    provider: deepinfra

memory:
  embedding:
    model: text-embedding-3-small
  extractor:
    model: gpt-6-luna
  thresholds:
    fact_confidence_min: 0.7
    preference_confidence_min: 0.8
    semantic_dedup_cosine: 0.92
  retrieval:
    facts_top_k: 5
    episodes_top_k: 2
    recent_turns: 6
  episode:
    min_turns: 3
